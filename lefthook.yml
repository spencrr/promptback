# Git hooks (installed by `npm ci` through the `prepare` script; re-run `npx lefthook install` after cloning
# with --ignore-scripts). Skip once with `LEFTHOOK=0 git commit`.
pre-commit:
  parallel: true
  jobs:
    - name: biome
      # Lint, format and import order on the staged files only; fixes are written and re-staged.
      run: npx biome check --staged --no-errors-on-unmatched --write
      stage_fixed: true
    - name: versions
      # The five version fields must move together (see packages/core/test/versions.test.ts).
      glob: "{package.json,packages/*/package.json,packages/cli/server.json}"
      run: npx vitest run packages/core/test/versions.test.ts --reporter=dot

pre-push:
  jobs:
    - name: typecheck
      run: npm run typecheck