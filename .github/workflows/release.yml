name: Release

# Cut a release with `node scripts/release.mjs <version> --push` (see CONTRIBUTING.md → Releases). This workflow:
#   1. verifies the tag points at main and matches every version field, and runs the full check
#   2. builds every artifact once: the CLI tarball, one VSIX per platform, SHA256SUMS.txt
#   3. publishes the GitHub Release (draft → assets → publish, so it is safe under immutable releases)
#   4. publishes to each registry whose repository variable is "true" (Settings → Secrets and variables → Actions):
#        PUBLISH_NPM          npm, trusted publishing (OIDC); provenance is automatic once the repository is public
#        PUBLISH_MARKETPLACE  VS Code Marketplace, `vsce publish --oidc` (needs the Marketplace side to be enabled)
#        PUBLISH_OPENVSX      Open VSX, trusted publishing (OIDC)
#        PUBLISH_MCP          MCP registry, GitHub OIDC, after npm (the registry checks the npm package's mcpName)
#      Unset variables skip the job, which is how publishing stays on hold. No registry needs a stored secret.
# Tags with an odd minor (v0.7.x) are pre-releases: Marketplace/Open VSX pre-release channel and a GitHub prerelease.
#
# `workflow_dispatch` runs everything up to the GitHub Release against any ref with publishing forced off (dry run).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    name: Verify the tag and run the checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Version, channel and whether this run may publish
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME does not point at a commit on main"; exit 1; }
            publish=true
          else
            publish=false
          fi
          for f in packages/core/package.json packages/cli/package.json packages/vscode/package.json packages/cli/server.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$version" ] || { echo "::error file=$f::version $v does not match $version"; exit 1; }
          done
          minor=$(echo "$version" | cut -d. -f2)
          prerelease=$([ $((minor % 2)) -eq 1 ] && echo true || echo false)
          echo "version=$version"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "publish=$publish"       >> "$GITHUB_OUTPUT"
          echo "::notice::Promptback $version ($([ "$prerelease" = true ] && echo pre-release || echo release); publish=$publish)"
      - run: npm run check

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: CLI tarball and one VSIX per platform
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          mkdir -p artifacts
          npm pack -w packages/cli --pack-destination artifacts
          flag=$([ "$PRERELEASE" = true ] && echo --pre-release || echo)
          for target in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-arm64; do
            node packages/vscode/scripts/package.mjs --target "$target" $flag
          done
          mv packages/vscode/*.vsix artifacts/
          (cd artifacts && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # The section for this version, without its heading.
          awk -v v="$VERSION" '/^## \[/{p=index($0, "[" v "]")>0; if(p){next}} p && /^## /{exit} p' CHANGELOG.md > artifacts/NOTES.md
          [ -s artifacts/NOTES.md ] || echo "See CHANGELOG.md." > artifacts/NOTES.md
          printf '\n\nArtifacts: the `promptback` CLI (npm tarball) and one VSIX per platform; `SHA256SUMS.txt` lists their digests.\n' >> artifacts/NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: artifacts/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: artifacts
      - name: Create as a draft, attach every asset, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          mv artifacts/NOTES.md notes.md
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Promptback ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag \
            $([ "$PRERELEASE" = true ] && echo --prerelease)

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [verify, build, github-release]
    if: needs.verify.outputs.publish == 'true' && vars.PUBLISH_NPM == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - name: npm publish (trusted publishing; the tag decides between latest and next)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          if curl -fsS "https://registry.npmjs.org/promptback/$VERSION" > /dev/null; then
            echo "::notice::promptback@$VERSION is already on npm; nothing to publish"; exit 0
          fi
          npm publish -w packages/cli --access public --tag "$([ "$PRERELEASE" = true ] && echo next || echo latest)"

  publish-marketplace:
    name: Publish to the VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [verify, build, github-release]
    if: needs.verify.outputs.publish == 'true' && vars.PUBLISH_MARKETPLACE == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: artifacts
      - name: vsce publish every VSIX (each carries its target platform)
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          npx --no vsce publish --oidc --skip-duplicate --packagePath artifacts/*.vsix \
            $([ "$PRERELEASE" = true ] && echo --pre-release)

  publish-openvsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest
    needs: [verify, build, github-release]
    if: needs.verify.outputs.publish == 'true' && vars.PUBLISH_OPENVSX == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.verify.outputs.version }}
          path: artifacts
      - name: ovsx publish every VSIX (trusted publishing is picked up from the Actions OIDC token)
        env:
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath artifacts/*.vsix \
            $([ "$PRERELEASE" = true ] && echo --pre-release)

  publish-mcp:
    name: Publish to the MCP registry
    runs-on: ubuntu-latest
    needs: [verify, publish-npm]
    if: needs.verify.outputs.publish == 'true' && vars.PUBLISH_MCP == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Wait until npm serves the version the registry will verify
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://registry.npmjs.org/promptback/$VERSION" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::promptback@$VERSION is not on npm yet"; exit 1
      - name: mcp-publisher login (GitHub OIDC grants io.github.${{ github.repository_owner }}/*) and publish
        working-directory: packages/cli
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          if ./mcp-publisher publish 2>&1 | tee publish.log; then exit 0; fi
          grep -q "already exists" publish.log && { echo "::notice::this version is already in the registry"; exit 0; }
          exit 1