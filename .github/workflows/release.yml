name: Release

# Cut a release with `node scripts/release.mjs <version> --push` (see CONTRIBUTING.md → Releases). Four stages:
#
#   check    the tag is on main or a release/* branch and matches every version field.
#   checks   lint, typecheck and the full test matrix, from test.yml: the same steps CI runs on every commit, run
#            again here so the release is tested in its own right rather than trusting an earlier run.
#   build    the third-party build tooling (npm, esbuild, vsce), with a read-only token and no package cache.
#   publish  runs no third-party build code. It takes the artifacts from the build job, attests how they were built,
#            creates the GitHub Release and publishes to each registry whose repository variable is "true":
#              PUBLISH_NPM          npm, trusted publishing (OIDC); provenance is automatic for a public repository
#              PUBLISH_MARKETPLACE  VS Code Marketplace, `vsce publish --oidc` (needs the Marketplace side enabled)
#              PUBLISH_OPENVSX      Open VSX, trusted publishing (OIDC)
#              PUBLISH_MCP          MCP registry, GitHub OIDC, after npm (the registry checks the npm package)
#            Unset variables skip the step, which is how publishing stays on hold. No registry needs a stored secret.
#            The job holds the only write token and the OIDC token, and it waits in the `release` environment for
#            the maintainer's approval first: a leaked push credential can start a build, not a publish.
#
# Tags with an odd minor (v0.7.x) are pre-releases: Marketplace/Open VSX pre-release channel, npm `next`, GitHub
# prerelease. Releases are immutable (a repository setting), so GitHub signs a release attestation as well:
# `gh release verify-asset vX.Y.Z <file>`; the build provenance: `gh attestation verify <file> --owner spencrr`.
#
# There is deliberately no workflow_dispatch: CI's "Build artifacts" job produces the same artifacts on every push,
# which is the dry run.
on:
  push:
    tags: ["v*.*.*"]

# One run per tag, never cancelled part-way: a half-published release is worse than a late one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must be on main or a release branch, and match every version field
        id: meta
        run: |
          git fetch --no-tags --depth=200 origin '+refs/heads/main:refs/remotes/origin/main' '+refs/heads/release/*:refs/remotes/origin/release/*'
          on_branch=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/main 'refs/remotes/origin/release/*' --contains "$GITHUB_SHA")
          if [ -z "$on_branch" ]; then echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main or a release/* branch"; exit 1; fi
          echo "On: $on_branch"
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json packages/core/package.json packages/cli/package.json packages/vscode/package.json packages/cli/server.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "::error file=$f::version $v does not match tag $tag"; exit 1; }
          done
          minor=$(echo "$tag" | cut -d. -f2)
          prerelease=$([ $((minor % 2)) -eq 1 ] && echo true || echo false)
          echo "version=$tag"             >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease"   >> "$GITHUB_OUTPUT"
          echo "::notice::Promptback $tag ($([ "$prerelease" = true ] && echo pre-release || echo release))"

  checks:
    name: Checks
    needs: check
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read

  build:
    name: Build the release
    needs: [check, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache here: a poisoned cache entry would end up inside the published artifacts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: CLI tarball and one VSIX per platform
        env:
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          mkdir -p artifacts
          npm pack -w packages/cli --pack-destination artifacts
          flag=$([ "$PRERELEASE" = true ] && echo --pre-release || echo)
          for target in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-arm64; do
            node packages/vscode/scripts/package.mjs --target "$target" $flag
          done
          mv packages/vscode/*.vsix artifacts/
          ls -l artifacts/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # Sigstore for the provenance attestation; trusted publishing on npm, Open VSX, the Marketplace, the MCP registry
      attestations: write # store the provenance attestation on the repository
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      # Only for CHANGELOG.md and packages/cli/server.json; nothing is built or installed in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ github.sha }}
          path: artifacts/
      # Signed statement that each file came out of this workflow at this commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Release notes from the changelog
        run: |
          # The section for this version, without its heading, and without the link definitions at the end of the
          # file (the oldest section runs into those). Trailing blank lines go too.
          awk -v v="$VERSION" '/^## \[/{p=index($0, "[" v "]")>0; if(p){next}} p && (/^## / || /^\[[^]]+\]: /){exit} p' CHANGELOG.md \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat >> notes.md <<EOF


          **Install:** the CLI with \`npm install -g promptback@$VERSION\`; the extension from the VSIX for your platform
          (**Help → About** in VS Code shows the architecture) via **Extensions → … → Install from VSIX**.
          **Verify** a downloaded file is the one this release published and was built by this repository's workflow
          (update \`gh\` if the commands are missing): \`gh release verify-asset $GITHUB_REF_NAME <file>\` and
          \`gh attestation verify <file> --owner spencrr\`.
          EOF
      - name: Create the GitHub Release (draft, assets, publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Promptback $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            $([ "$PRERELEASE" = true ] && echo --prerelease)

      # Node for the registry CLIs only; nothing is installed from the lockfile here, so no cache.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm (trusted publishing; the tarball from the build job, no install)
        if: vars.PUBLISH_NPM == 'true'
        run: |
          if curl -fsS "https://registry.npmjs.org/promptback/$VERSION" > /dev/null; then
            echo "::notice::promptback@$VERSION is already on npm"; exit 0
          fi
          npm publish artifacts/promptback-"$VERSION".tgz --access public --tag "$([ "$PRERELEASE" = true ] && echo next || echo latest)"
      - name: VS Code Marketplace (vsce --oidc; every VSIX carries its target platform)
        if: vars.PUBLISH_MARKETPLACE == 'true'
        run: |
          npx --yes @vscode/vsce@4.0.0 publish --oidc --skip-duplicate --packagePath artifacts/*.vsix \
            $([ "$PRERELEASE" = true ] && echo --pre-release)
      - name: Open VSX (trusted publishing is picked up from the Actions OIDC token)
        if: vars.PUBLISH_OPENVSX == 'true'
        run: |
          npx --yes ovsx@1.3.0 publish --skip-duplicate --packagePath artifacts/*.vsix \
            $([ "$PRERELEASE" = true ] && echo --pre-release)
      - name: MCP registry (GitHub OIDC grants io.github.${{ github.repository_owner }}/*; after npm, which it verifies)
        if: vars.PUBLISH_MCP == 'true'
        working-directory: packages/cli
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://registry.npmjs.org/promptback/$VERSION" > /dev/null && break
            [ "$i" = 30 ] && { echo "::error::promptback@$VERSION is not on npm yet"; exit 1; }
            sleep 10
          done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          if ./mcp-publisher publish 2>&1 | tee publish.log; then exit 0; fi
          grep -q "already exists" publish.log && { echo "::notice::this version is already in the registry"; exit 0; }
          exit 1