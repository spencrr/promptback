name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer run on the same branch supersedes an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # onnxruntime-node's postinstall would download CUDA binaries on linux-x64 with npm < 11.19 (newer npm blocks
  # install scripts unless package.json allows them, which it does not). The CPU binaries ship in the package.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # No dependency needs an install script (see allowScripts in package.json); skipping them everywhere closes
      # the usual npm supply-chain vector regardless of the runner's npm version.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        # arm64: macos-latest already is; one Linux and one Windows cell on the current LTS prove the native
        # onnxruntime binding loads and runs there (packages/core/test/ort.test.ts).
        include:
          - os: ubuntu-24.04-arm
            node: 24
          - os: windows-11-arm
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Pack the CLI
        run: |
          mkdir -p artifacts
          npm pack -w packages/cli --pack-destination artifacts
      - name: Package the extension for every supported platform
        # onnxruntime-node ships binaries for all of these inside one npm package, so one runner builds them all.
        run: |
          for target in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-arm64; do
            node packages/vscode/scripts/package.mjs --target "$target"
          done
          mv packages/vscode/*.vsix artifacts/
      - name: Inspect artifact metadata
        run: |
          ls -la artifacts
          tar -xOf artifacts/promptback-*.tgz package/package.json | node -e 'const p=JSON.parse(require("fs").readFileSync(0,"utf8")); console.log(p.name, p.version, p.license, JSON.stringify(p.bin), p.mcpName)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: promptback-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
